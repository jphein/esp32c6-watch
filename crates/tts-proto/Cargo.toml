# tts-proto — notification read-aloud protocol core
# (design spec docs/superpowers/specs/2026-07-27-tts-notify-readaloud-design.md).
#
# Deliberately a STANDALONE crate (not a module in the firmware crate): the
# firmware package's deps (esp-hal/esp-radio/slint/…) don't build for the host,
# so a `src/net/tts_proto.rs` module could never be `cargo test`-ed. Isolating
# the pure logic here keeps it host-testable (only `heapless`) and fully no_std
# on target. `src/net/voice_tts.rs` pulls it in via
# `tts-proto = { path = "crates/tts-proto" }`.
#
# Composes speech from UNTRUSTED MQTT notification payloads and parses the LAN
# bridge's HTTP response — every path is bounded and panic-free (same discipline
# as crates/climate-model and crates/scan-model's adversarial parser).
[package]
name = "tts-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pure no_std TTS read-aloud protocol core: notification->speech composition, JSON request encoding, bridge HTTP response framing, and 16kHz PCM chunk math. Untrusted-input hardened; host-testable."
license = "MIT OR Apache-2.0"

[lib]
name = "tts_proto"
path = "src/lib.rs"

[dependencies]
heapless = "0.9"
