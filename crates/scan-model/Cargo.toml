# RS2 — passive 802.15.4 scan data model + MAC-header parser.
#
# Deliberately a STANDALONE crate (not a module in the firmware crate): the
# firmware package's deps (esp-hal/esp-radio/slint/…) don't build for the host,
# so a `src/net/scan_model.rs` module could never be `cargo test`-ed on the host
# as the plan requires. Isolating the pure logic here keeps it host-testable
# (only `heapless`) and fully no_std for the on-target build. RS3/RS6 pull it
# into the firmware via `scan-model = { path = "crates/scan-model" }`.
[package]
name = "scan-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "scan_model"
path = "src/lib.rs"

[dependencies]
heapless = "0.9"
