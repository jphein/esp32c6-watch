# mesh-elect — fleet-wide deterministic ESP-NOW channel + gateway election.
#
# Deliberately a STANDALONE crate (not a module in the firmware crate): the
# firmware package's deps (esp-hal/esp-radio/slint/…) don't build for the host,
# so a `src/net/mesh_elect.rs` module could never be `cargo test`-ed. The
# consensus PROPERTIES this implements (convergence, permutation invariance,
# tie-breaking, hysteresis, partition merge) are exactly the things that cannot
# be validated on glass — a watch shows you one node's opinion at a time. So the
# logic lives here, host-tested, and the firmware is a thin adapter over it.
#
# Same rationale + shape as crates/scan-model and crates/rssi. Zero deps: no
# heapless even, because every table here is a fixed-size array (that is the
# point — an inbound frame must not be able to allocate).
#
# smol (the C3 nodes) must run the IDENTICAL logic or the fleet partitions;
# vendor this crate there rather than reimplementing it. See
# docs/superpowers/specs/2026-07-29-mesh-consensus-design.md.
[package]
name = "mesh-elect"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mesh_elect"
path = "src/lib.rs"

[dependencies]
