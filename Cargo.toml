[workspace]
members = [".", "crates/*"]
# The vendored Slint renderer fork is a [patch.crates-io] source, not a
# workspace member — keeps `cargo test --workspace` (host crates) untouched.
exclude = ["crates/i-slint-renderer-software"]

[package]
name = "esp32c6-watch"
version = "0.12.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[[bin]]
name = "esp32c6-watch"
path = "./src/main.rs"

[[bin]]
name = "slint-demo"
path = "./src/bin/slint_demo.rs"
# C6-ONLY (#cyd-c5). This demo hand-rolls its own bring-up against the CO5300 +
# FT3168 — it declares a hand-picked module subtree rather than using the crate's,
# so it does not see the board seam at all. Porting it to a second panel would be
# pure churn for a demo. `required-features` skips the binary on other boards
# instead, which is the honest statement: it targets the C6 AMOLED.
required-features = ["board-waveshare-c6"]

[features]
# `debug-console` is OPT-IN (NOT default): it disables AOD light-sleep and reads
# USB-Serial-JTAG RX to drive/measure the UI for agent tests — great for testing,
# but battery-draining for a shipped build. Release cut = default (no console, AOD
# on). Test builds add `--features debug-console`. See src/debug_console.rs +
# tools/ui_test.py.
# `tts` is ON by default as of 2026-07-29 (JP's call). Enabling the FEATURE does not
# make the watch talk: the runtime default is `SpeakMode::OnDemand`
# (config.rs:233), so it speaks only when asked from the notification card. `Auto`
# is a separate, deliberate setting.
default = ["board-waveshare-c6", "tts"]
# ---------------------------------------------------------------------------
# BOARD TARGETS (#cyd-c5). The chip feature is supplied by the BOARD feature,
# never by a dependency declaration — esp-hal's chip features are mutually
# exclusive, so hardcoding "esp32c6" in the dep lists made a second board
# unrepresentable in this manifest. Exactly one board feature must be enabled:
#
#   default                                       -> Waveshare C6 watch
#   --no-default-features --features board-cyd-c5,...  -> NM-CYD-C5
#
# A board feature carries (a) the chip feature for every esp-* dep, and (b) the
# CAPABILITY features for hardware that board actually has. Capabilities gate
# code (`#[cfg(feature = "has-pmu")]`), boards select capabilities — the OpenWrt
# model smol's budget.rs documents: predicate on a declared capability, never on
# a chip name.
board-waveshare-c6 = [
    "esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-radio/esp32c6",
    "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6",
    "esp-println/esp32c6", "esp-backtrace/esp32c6",
    "has-pmu", "has-imu", "has-audio", "has-cap-touch",
    "has-die-temp", "has-light-sleep", "has-ble",
]
board-cyd-c5 = [
    "esp-hal/esp32c5", "esp-rtos/esp32c5", "esp-radio/esp32c5",
    "esp-storage/esp32c5", "esp-bootloader-esp-idf/esp32c5",
    "esp-println/esp32c5", "esp-backtrace/esp32c5",
    "has-5ghz-wifi", "has-psram",
    # DIAGNOSTIC, carried deliberately (image 8). Not a capability — a live
    # investigation. Listed HERE rather than passed as `--features` because
    # tools/ota_push.sh documents that forgetting `--features` silently REMOVES
    # an opt-in feature from the next push; an investigation that evaporates on
    # the first routine OTA cannot answer the question it was cut for. Delete
    # this line (and the block at the end of drivers/xpt2046.rs) when the swipe
    # question is answered.
    "touch-telemetry",
    # SELF-VERIFICATION, and listed HERE for the same reason `touch-telemetry` is
    # — the reasoning above applies with more force, not less.
    #
    # JP's directive: "stop waiting for me on anything you should be testing
    # yourself." `tools/ui_test.py` drives synthetic taps/swipes through the real
    # touch path and reads back per-frame render durations, so an image can be
    # asserted PASS/FAIL before a human ever wears it. That only works if the
    # console is IN the image.
    #
    # ★ IT ALREADY DROPPED OUT ONCE, SILENTLY, MID-CAMPAIGN. This is not a
    # hypothetical risk — it is a measured incident, and it is why the flag lives
    # here instead of on the command line. `strings <elf> | grep -c DBGCON`, run
    # over the preserved artifacts:
    #
    #     img9dbg  15     img10d 15     img10f 15     img10h 15     img10i 15
    #     img11     0     img12   0     img13   0     img14   0
    #
    # It was present for five images and vanished at the **img11 rebuild** — the
    # build where `boot-radio-off` was removed and the `--features` line was
    # retyped from scratch. Nobody noticed for FOUR images. It surfaced only when
    # someone tried to drive the board and got silence, and even then the first
    # diagnosis blamed the transport, because a healthy log stream on the cable
    # reads as "the console is fine".
    #
    # (An earlier version of this comment claimed the console had never been in
    # ANY image of the series. That was wrong — measured on two artifacts and
    # generalised to ten — and it made the case for this change WEAKER by turning
    # a real incident into a counterfactual.)
    #
    # A self-test that can silently drop out is WORSE than none: the next green run
    # gets trusted while testing a binary that cannot be driven at all. An
    # investigation that evaporates cannot answer the question it was cut for; a
    # verification that evaporates lies about one.
    #
    # Costs, both checked rather than assumed: it disables AOD light-sleep (moot
    # here — this board does not declare `has-light-sleep`, so AOD already uses a
    # plain timer wait) and it pulls `embedded-io-async`, which the UART0 reader
    # needs anyway.
    "debug-console",
]
# Hardware capabilities. Empty markers — they exist to be cfg'd on.
# AXP2101 PMU: battery gauge, power-key latch, power page.
has-pmu = []
# QMI8658 IMU: pedometer, wrist-raise, tilt games.
has-imu = []
# ES8311 codec + ES7210 ADC + amp: all sound out, mic, voice, story AUDIO.
has-audio = []
# Capacitive touch (FT3168). The CYD's XPT2046 is resistive: same TouchPoint
# contract, different driver + calibration; nothing gates on this yet but the
# distinction is real (pressure vs contact, debounce needs).
has-cap-touch = []
# TSENS on-die temperature sensor (esp-hal exposes it on the C6; not on the C5
# in 1.1.x).
has-die-temp = []
# rtc_cntl light sleep + the RC_FAST/REF_TICK calibration machinery (#43). The
# C5's esp-hal 1.1.x has no `rtc_cntl::sleep`; a board without this capability
# replaces the AOD light-sleep poll with a plain timer wait — same cadence,
# more current, no chip-specific code.
has-light-sleep = []
# BLE host stack (trouble-host + the NimBLE controller blob). A CAPABILITY rather
# than a chip fact: the C5 has BLE silicon, but `BleConnector::new` costs ~29.5 KB
# of heap UNCONDITIONALLY at boot — before `watch_cfg` is even loaded, so it
# cannot consult the runtime toggle — and the C5 does not have 29.5 KB to spend
# on a radio that boots off. Turn this on for the CYD once radio init moves after
# config load and can be made lazy.
has-ble = []
# Dual-band radio (2.4 + 5 GHz). The C5 has it; the C6 does not. It exists to be
# PINNED OFF: esp-radio's `BandMode` defaults to `Auto` on 5 GHz-capable silicon,
# and the smol mesh is ESP-NOW on a 2.4 GHz channel — so a station that wanders
# onto a 5 GHz leg leaves the mesh and lands where the C3/C6 fleet cannot follow.
# See `set_sta_config` in src/net/net_task.rs.
has-5ghz-wifi = []
# External SPI RAM wired to the MSPI bus. The C5 module carries 8 MB; the C6
# board has none (see the header comment in src/main.rs).
#
# This gates TWO things that must stay in lockstep, which is the whole reason it
# is a capability and not an inline `#[cfg(feature = "board-cyd-c5")]`:
#
#   1. the `psram_allocator!` registration in `main()`, and
#   2. `RGN_MAIN`/`RGN_RECL` — the INDICES the heap logs read.
#
# Registering a third region shifts the internal pools one slot along in
# `HEAP.stats().region_stats`, so a board that gains PSRAM without moving those
# indices keeps printing `main=`/`recl=` against the wrong regions. That failure
# is silent and it corrupts the exact telemetry a PSRAM image exists to produce.
# One flag, both sites, no way to move one without the other.
#
# ⚠️ NOT a licence to allocate DMA buffers from the heap: C5 DMA cannot reach
# PSRAM under esp-hal 1.1.x. The display's buffers come from `dma_buffers!`
# (static, internal) and every heap-side pixel slice is re-staged through
# `SharedSpiBus::stage` before the transfer — see the note at
# src/drivers/spi_bus.rs:342, which is now load-bearing for more than byte order.
has-psram = []

# ---------------------------------------------------------------------------
# DIAGNOSTICS. Not capabilities — capabilities describe a board and are
# permanent; these describe an open QUESTION and are meant to be deleted.
# ---------------------------------------------------------------------------
# Per-gesture touch accounting on the XPT2046, one line per lift ([TOUCH-DBG]).
# Open question: most of JP's CYD swipes register as taps. Suspect is sampling
# starvation (a 61.4 ms full-frame paint swallowing a fast swipe), NOT the
# pressure gate — so this must NOT be read as licence to tune
# TOUCH_PRESSURE_THRESHOLD or SWIPE_MIN_*. It rides along with the span-run
# flusher (83c8491) precisely so the fix can be CONFIRMED from ordinary use
# instead of argued about. Costs nothing when off (ZST + empty methods).
touch-telemetry = []
# Suppress the BOOT WiFi auto-connect. EMERGENCY MEASURE for the deterministic
# boot-crash loop (Slint dep-node alloc dies at properties.rs:63 during the
# WiFi-connect heap squeeze, ~15-25 s after every boot). Gives a board that holds
# uptime so the bench is usable while the region-architecture work is done
# properly.
#
# ★ NOT listed in any board feature, and that is the opposite call from
# `touch-telemetry` above — deliberately. Telemetry had to survive a forgotten
# `--features` because an investigation that evaporates answers nothing. This one
# must EVAPORATE by default: a radio silently staying off in a later image would
# be a worse bug than the one it works around. Pass it explicitly or don't get it.
#
# Costs no OTA on the image that carries it (no radio), which is acceptable only
# because flashing goes through the serial guard anyway.
boot-radio-off = []

debug-console = ["dep:embedded-io-async"]
# `tts` (read notifications aloud) is now ON BY DEFAULT — see `default` above.
#
# THE ROM REASON IT WAS OFF IS OBSOLETE — it was the whole justification and it is gone.
# This used to read "the firmware is OUT OF ROM": the 4 MiB region esp-hal
# hardcodes for the C6 had 6,952 B free at 9363d52 and this feature needs ~9.9 KB,
# so it could not link. `build.rs::widen_rom_region` (#67) raised the region to the
# 6 MiB `partitions.csv` already reserves per OTA slot, and ROM is now at
# **51.2 % used, ~3.07 MB free** (measured 2026-07-29). The stated blocker no
# longer exists.
#
# What it costs now, measured on familiar rather than estimated:
#
#   default      stack gap 80,592   margin +8,912
#   tts          stack gap 80,264   margin +8,584   <- tts = 328 B of stack
#   story        stack gap 75,000   margin +3,320
#   story,tts    stack gap 74,904   margin +3,224
#
# So it was a 328 B question against ~8.6 KB of margin, not a link failure — and the
# product concern turned out to be unfounded too: `SpeakMode::OnDemand` is the runtime
# default, so a watch with this compiled in stays silent until someone taps the speaker
# control or chooses `Auto`. The feature being present and the watch talking are two
# different switches.
#
# Same discipline as audio_out::CHIME_ENABLED — gated behind one flag rather than
# reverted, so it flips on in one line.
# See docs/superpowers/specs/2026-07-27-tts-notify-readaloud-design.md.
tts = ["dep:tts-proto"]
# `heap-forensics` is OPT-IN and MUST NOT ship on. It adds a harvest sweep to
# every `log_heap` call: take every free block the allocator will give, count the
# bytes, hand them all back. That is the one measurement that separates "out of
# contiguous memory" (ordinary fragmentation — `free()` is honest) from "`free()`
# is reporting holes that have been LOST" (heap corruption — the `Bad free?`
# class documented in src/ui/slint_shell.rs). See `harvest_free` in src/main.rs.
#
# Off by default because at peak the sweep really does drain the heap down to its
# 16 KB reserve, and the esp-rtos threads allocate concurrently with it — a
# shipped build would be trading a diagnostic for a chance of starving the WiFi
# blob's `malloc`. Diagnostic runs only: `--features heap-forensics`.
heap-forensics = []
# `heap-hooks` is the ATTRIBUTION counterpart to `heap-forensics`, and is a
# deliberately separate flag because the two cost wildly different things.
# `heap-forensics` perturbs what it measures (it drains the pool to a 16 KB
# reserve) and must never ship on. This one only counts: it installs esp-alloc's
# `_esp_alloc_alloc`/`_esp_alloc_dealloc` hooks and adds 64 B of `.bss` plus a
# few relaxed atomic adds per allocation. Folding it into `heap-forensics` would
# saddle a cheap, safe instrument with a never-enable constraint it has not
# earned.
#
# It answers the two questions source-reading could not close on #75: the WiFi/
# BLE blob split (every blob `malloc` funnels through the hooked
# `HEAP.alloc_caps`, so the closed stack is finally visible), and Slint's
# dependency-node count (a node is exactly 16 B, so the `<=16` bucket delta
# across scene construction IS the count). `internal-heap-stats` rides along for
# `max_usage` — a measured high-water mark, which is the one number the static
# census could only estimate.
#
# Diagnostic runs: `--features heap-hooks`. See src/heap_hooks.rs.
heap-hooks = ["esp-alloc/alloc-hooks", "esp-alloc/internal-heap-stats"]
# `story` (the Endless LitRPG reader/player) is OPT-IN and OFF BY DEFAULT — but
# for a different reason than `tts`: ROM is no longer the constraint. Measured
# 2026-07-29 against the widened region (#67): **2,098,526 B free**, so size is
# a non-issue. It ships off because this is JP's working watch and the shipped
# default build stays byte-identical until the app has been on glass once. One
# line to flip.
#
# What it costs, and why that is the number to watch instead: ~5 KB of `.bss` for
# the retained models (asserted by a host test in `story-proto`) plus ~2 KB of
# socket and PCM staging buffers, against a MEASURED stack-gap headroom of
# 9,408 B (gap 81,088 vs the 71,680 B floor). `.bss` growth steals stack
# silently, so `tools/preflight.sh` asserting the gap is the real gate — not a
# successful link.
#
# See ~/Projects/endlesslitrpg/docs/superpowers/specs/2026-07-29-endless-litrpg-design.md §9.4.
story = ["dep:story-proto"]

# MEASUREMENT-ONLY, NEVER SHIP (#75). Substitutes a MAX_SLOT_VAL-length value with
# `known: true` into all 17 equipment/appearance slots, to measure the CHAR page in
# the state the daemon WILL produce once it sends equipment data.
#
# Why it must exist: the live ledger sends every slot null, and `story.slint:517`
# renders an unknown slot as `"—"` — one glyph. So the 512 scene-pool rung is
# UNREACHABLE against today's daemon, and the projected reclaimed floor after that
# rung arms (~7,352 B, vs a measured 18,616 B today) cannot otherwise be tested.
# Forcing the value alone does nothing; `known: true` is required or the `"—"`
# branch renders.
story-stub-slots = ["story"]

[dependencies]
esp-hal = { version = "~1.1.0", features = [
    "unstable",
    "log-04",
] }

esp-rtos = { version = "0.3.0", features = [
    "esp-radio",
    "esp-alloc",
    "embassy",
    "log-04",
]}

esp-radio = { version = "0.18.0", features = [
    "wifi",
    "ble",
    "coex",
    "esp-now",
    "esp-alloc",
    "unstable",
    "log-04",
] }

embassy-net = { version = "0.9.1", features = [
    "tcp",
    "udp",
    "dns",
    "dhcpv4",
    "medium-ethernet",
    "log",
] }
embedded-io = "0.7"
# debug-console only: async `Read` for esp-hal's UsbSerialJtag<Async>. The 0.7
# line unifies with esp-hal's own `embedded-io-async-07` (enabled by its
# `unstable` feature), so the trait we import is the one the HAL impls.
embedded-io-async = { version = "0.7", optional = true }
esp-storage = { version = "0.9.0", features = [] }
embedded-storage = "0.3"

esp-bootloader-esp-idf = { version = "0.5.0", features = [
    "log-04",
] }
log = "0.4.27"

esp-println = { version = "0.17.0", features = [
    "log-04",
] }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println",
    # custom-halt: reboot instead of hanging forever on panic (#75). Without it
    # esp-backtrace ends in `loop {}` inside `interrupt_free`, which is exactly
    # the "watch is bricked until you power-cycle it" experience. See
    # `custom_halt` in src/main.rs.
    "custom-halt",
] }
esp-alloc = "0.10.0"
embassy-executor = { version = "0.10.0", features = [
    "log",
] }
embassy-time = { version = "0.5.0", features = ["log"] }

static_cell = "2.1.1"
critical-section = "1.2.0"

# BLE host stack (GATT server). 0.6.x is the newest release compatible with
# esp-radio 0.18, whose BleConnector implements bt-hci 0.8's Transport trait
# (trouble-host 0.7 moved to bt-hci 0.9).
trouble-host = { version = "0.6.0", features = ["log"] }
# The #[gatt_server] macro expands to code referencing `embassy_sync`, so it
# must be a direct dependency; pin to the 0.7 line trouble-host 0.6 uses.
embassy-sync = "0.7"

embassy-futures = "0.1"
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4"
embedded-hal = "1.0"
embedded-hal-bus = "0.3.0"
heapless = "0.9"
u8g2-fonts = "0.8.0"

# Local workspace crates (smol-port). Pure-logic, no_std, host-unit-tested.
# #55: write-range guard math for GuardedFlash (the FlashMutex wrapper) —
# refuses any flash write whose erase footprint hits the booted app slot.
flash-guard = { path = "crates/flash-guard" }
wled-wizmote = { path = "crates/wled-wizmote" }
rssi = { path = "crates/rssi" }
hunt = { path = "crates/hunt" }
# Fleet-wide deterministic ESP-NOW channel + gateway election (2026-07-29). One
# radio means choosing the AP IS choosing the mesh channel, so mesh partitions
# are really AP-agreement failures. Pure `elect(observations) -> Decision` plus
# the `SMOLv1 ELECT` wire codec, host-tested for convergence / tie-breaking /
# hysteresis / partition merge — properties that cannot be observed on glass.
# MUST stay byte-identical with smol's copy or the fleet partitions silently.
mesh-elect = { path = "crates/mesh-elect" }
# #58: pure-logic HA climate parse/encode (oracle-t9 CONFIRMED-CLEAN @5c0d04c) —
# replaces src/net/climate_model_stub.rs.
climate-model = { path = "crates/climate-model" }
# #28: pure-logic mic sound-level DSP (rms_dbfs) — host-unit-tested. Drives the
# SoundLevel meter from the shared mic capture (MIC_CH).
mic-dsp = { path = "crates/mic-dsp" }
# #34: pinned realm-sigil corpus + index math (vendored verbatim from smol) +
# the MAC-seeded per-device identity derivations — host-unit-tested. Serves
# both mesh peer names (src/net/names.rs re-export) and the device sigil
# (src/net/sigil.rs).
sigil-id = { path = "crates/sigil-id" }
# Read-aloud protocol core: notification->speech composition, JSON request
# encoding (escapes attacker-influenced MQTT text), bridge HTTP response
# framing, 16 kHz chunk math. Host-unit-tested; feeds src/net/voice_tts.rs.
tts-proto = { path = "crates/tts-proto", optional = true }
story-proto = { path = "crates/story-proto", optional = true }

# Slint UI toolkit (no_std MCU backend, software renderer) — used by the
# `slint-demo` binary only.
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1.17.1"
# The same word tables the firmware uses for DEVICE names also name each BUILD
# (`FORGE`), computed host-side in build.rs and passed in as a `rustc-env`
# string. Depending on it here rather than re-copying the corpus is the whole
# point of the crate: realm-sigil's Rust binding exists because smol hand-copied
# its corpus twice and both copies drifted. Zero-dependency and `no_std`, so it
# builds for the host as a build-dep and for riscv as a normal dep.
sigil-id = { path = "crates/sigil-id" }

# Vendored fork of Slint's software renderer with ONE local patch: even-grid
# dirty-region alignment for the CO5300's CASET/RASET window restrictions
# (issue #18 — Slint 1.17 has no LVGL-rounder equivalent). See the crate's
# README for the divergence contract; grep `esp32c6-watch LOCAL PATCH`.
[patch.crates-io]
i-slint-renderer-software = { path = "crates/i-slint-renderer-software" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1       # LLVM can perform better optimizations using a single thread
debug = 2               # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'

# ---------------------------------------------------------------------------
# THE RASTERISER IS NOT A SIZE PROBLEM. It is the whole latency budget.
# ---------------------------------------------------------------------------
# MEASURED with [RENDER-DBG] dt on image 10e (26.67 MHz, 0.600 us/pixel exact):
#
#   page-turn hard cut   230 lines / 2 spans   -> 209 ms   (wire 44 ms = 21%)
#   partial repaint      244 lines / 18 spans  -> 131 ms
#   partial repaint      132 lines / 2 spans   ->  83 ms
#
# So 65-80% of every paint is RENDER CPU — software rasterisation on a 240 MHz
# RV32IMAC with no FPU — and only ~21% is wire. Two corollaries settled the same
# measurement: window setups cost ~nothing (218 spans vs 18 spans are
# statistically indistinguishable, so no region-merge is worth doing), and the
# 20 -> 26 MHz clock bump could only ever buy 1.33x of that 21% = ~5-6% end to
# end, which is why it did not move the felt latency.
#
# And the whole time, the tight per-pixel loops were compiled with `-Os`. Size
# optimisation is the single worst trade for a scalar rasteriser: it gives up
# unrolling, inlining and strength reduction in exactly the loops that ARE the
# 65-80%. Nothing had ever overridden it — there were no per-package profiles in
# this manifest at all.
#
# ★ CROSS-TARGET SAFETY, checked before landing rather than after (smol#409,
# targets/s3-cyd/PORT-SCOPING.md §6.1): the S3's Xtensa arm has an opt-level
# constraint, and its resolution is the opposite of a blocker here —
#   "opt-level = 2 (or 3) under fat LTO links; the size-optimising levels (s, z)
#    are what provoke the scavenger crash"
# So 3 is documented-safe on Xtensa, and `s` — what we were using — is the level
# that CRASHES it. The S3 escapes via `CARGO_PROFILE_RELEASE_OPT_LEVEL=2`, an env
# override of the profile DEFAULT; per-package entries are a different key and
# survive it, so an S3 build gets these two crates at 3, which #409 permits. Its
# rule "never the shared global profile" is honoured: the global stays 's'.
#
# ⚠️ MANIFEST-GLOBAL, so this changes the C6 arm's codegen too. Not a behaviour
# change, but the C6 is a shipped product and its lane keeps a veto.
#
# ★ AND THE SIZE WENT DOWN, which is the opposite of what I predicted here before
# measuring. C5 app image: 3,517,280 -> 3,423,856 B, **-93,424 B (-2.7%)**. Under
# fat LTO, `-O3`'s aggressive inlining exposes cross-crate constant folding and
# dead-code elimination that `-Os` was itself preventing; `-Os` optimises each
# function for size and can thereby forgo the inlining that would have deleted
# whole call graphs. So the size/speed trade this override was written to justify
# does not exist on this codebase — it is faster AND smaller. Measured, not
# argued: the prediction in this very comment was wrong and is left visible
# rather than quietly deleted.
[profile.release.package.i-slint-renderer-software]
opt-level = 3
[profile.release.package.i-slint-core]
opt-level = 3
# DEFERRED, deliberately not done in image 8: a `[profile.diagnostic]` inheriting
# release with `debug-assertions = true`, to catch overflow/slicing faults on the
# bench instead of as a silent wrong pixel.
#
# The condition it is waiting on — write it down, because nothing re-examines a
# deferral once its premise moves: after BLE gating the C5 sits on a 112 KB pool
# with a measured stack-floor margin of +14,632 B. debug-assertions changes both
# code size and stack depth, so turning it on INVALIDATES that margin and every
# soak number taken against it. Restructuring profiles mid-image would mean the
# image under test is not the image that was measured. Do it as its own change,
# with its own floor measurement — not as a rider.
