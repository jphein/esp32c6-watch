[package]
name = "esp32c6-watch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "esp32c6-watch"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = [
    "esp32c6",
    "unstable",
    "log-04",
] }

esp-rtos = { version = "0.3.0", features = [
    "esp-radio",
    "esp-alloc",
    "embassy",
    "esp32c6",
    "log-04",
]}

esp-radio = { version = "0.18.0", features = [
    "esp32c6",
    "wifi",
    "ble",
    "coex",
    "esp-now",
    "esp-alloc",
    "unstable",
    "log-04",
] }

embassy-net = { version = "0.9.1", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "log",
] }
embedded-io = "0.7"
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
embedded-storage = "0.3"

esp-bootloader-esp-idf = { version = "0.5.0", features = [
    "log-04",
    "esp32c6",
] }
log = "0.4.27"

esp-println = { version = "0.17.0", features = [
    "esp32c6",
    "log-04",
] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32c6",
    "panic-handler",
    "println",
] }
esp-alloc = "0.10.0"
embassy-executor = { version = "0.10.0", features = [
    "log",
] }
embassy-time = { version = "0.5.0", features = ["log"] }

static_cell = "2.1.1"
critical-section = "1.2.0"

embassy-futures = "0.1"
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4"
embedded-hal = "1.0"
embedded-hal-bus = "0.3.0"
heapless = "0.9"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1       # LLVM can perform better optimizations using a single thread
debug = 2               # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
