name: firmware build

# Build the ESP32-C6 firmware and publish flashable artifacts.
#
# Triggers:
#   * a version tag push (v*) -> build + attach the ELF and a flashable .bin to
#     that tag's GitHub Release.
#   * manual (workflow_dispatch) -> build + upload the same as a workflow
#     artifact, so the pipeline can be exercised without cutting a tag.
#
# NOTE: `.cargo/config.toml` is gitignored (it can hold WIFI_SSID/WIFI_PASS), so
# a fresh checkout has no build config. This job writes the build-relevant parts
# (target + rustflags) itself. WIFI creds are intentionally absent — main.rs
# reads them via `option_env!` and falls back to empty, so a credential-free CI
# build is correct (the watch takes creds at runtime via the Settings app).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create/attach GitHub Release assets on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Mirror rust-toolchain.toml: stable + rust-src + the riscv32imac bare-metal
      # target (its precompiled core/alloc are what the build uses; build-std in
      # the cargo config is tolerated/ignored on stable).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Recreate the gitignored build config (no runner, no creds — CI only
      # builds). Note: the repo's config carries `[unstable] build-std`, but on
      # the stable toolchain that's a no-op — the build uses the precompiled
      # riscv32imac target libs (verified: `cargo build --release` is green with
      # just target + rustflags). Omitting build-std here avoids any
      # unstable-feature error from a fresh CI cargo and produces the same binary.
      - name: Write .cargo/config.toml
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [build]
          target = "riscv32imac-unknown-none-elf"
          rustflags = ["-C", "force-frame-pointers"]

          # ESP_LOG is NOT a secret, and omitting it changed what we ship.
          #
          # It compiles the logging machinery in: measured at 4,064 B of `.bss`
          # (78,160 B stack gap without it vs 74,096 B with). Without this line the
          # released ELF/.bin had a DIFFERENT MEMORY LAYOUT from every binary we
          # test and flash — and #65 proved layout shifts on this chip flip latent
          # bugs on and off (the WiFi blob keeps globals at the top of .bss,
          # directly under the stack; an 8-byte shift moved a crash from 0% to
          # 100%). Shipping an untested layout is the risk, not the log volume.
          #
          # Credentials stay ABSENT deliberately (see the note at the top of this
          # file): main.rs reads them via `option_env!` and falls back to empty, and
          # the watch takes real creds at runtime from its config partition. Fake
          # placeholders were considered and REJECTED — they would bake a bogus
          # DEFAULT SSID/broker into the released artifact, which is worse than
          # empty. Their layout cost is ~48 B `.bss` / ~918 B ROM, negligible next
          # to ESP_LOG's 4 KB.
          [env]
          ESP_LOG = "info"
          EOF

      - name: Build firmware (release)
        run: cargo build --release --bin esp32c6-watch

      - name: Stage ELF
        run: cp target/riscv32imac-unknown-none-elf/release/esp32c6-watch esp32c6-watch.elf

      # Flashable images are best-effort: espflash pulls libudev; if the install
      # or save-image trips in CI, the ELF is still published and the job
      # succeeds. Two images:
      #   * esp32c6-watch-app.bin  — application-partition image only; flash at
      #     the ota_0 offset (0x10000) or via `espflash flash` / OTA.
      #   * esp32c6-watch-full.bin — merged flash-at-0x0 image (bootloader +
      #     partition table + app), foolproof for `esptool write_flash 0x0`.
      #     Uses the project's A/B OTA partitions.csv and 16MB flash so the
      #     ota_1/config slots fit and the on-device partition reader matches.
      - name: Build flashable .bin images (best-effort)
        id: bin
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
          cargo install espflash --version 4.5.0 --locked
          espflash save-image --chip esp32c6 esp32c6-watch.elf esp32c6-watch-app.bin
          espflash save-image --merge --chip esp32c6 \
            --partition-table partitions.csv --flash-size 16mb \
            esp32c6-watch.elf esp32c6-watch-full.bin

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esp32c6-watch-firmware
          path: |
            esp32c6-watch.elf
            esp32c6-watch-app.bin
            esp32c6-watch-full.bin
          if-no-files-found: warn

      - name: Attach to the tag's Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            esp32c6-watch.elf
            esp32c6-watch-app.bin
            esp32c6-watch-full.bin
          fail_on_unmatched_files: false
