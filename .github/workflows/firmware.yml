name: firmware build

# Build the ESP32-C6 firmware and publish flashable artifacts.
#
# Triggers:
#   * a version tag push (v*) -> build + attach the ELF and a flashable .bin to
#     that tag's GitHub Release.
#   * manual (workflow_dispatch) -> build + upload the same as a workflow
#     artifact, so the pipeline can be exercised without cutting a tag.
#
# NOTE: `.cargo/config.toml` is gitignored (it can hold WIFI_SSID/WIFI_PASS), so
# a fresh checkout has no build config. This job writes the build-relevant parts
# (target + rustflags) itself. WIFI creds are intentionally absent — main.rs
# reads them via `option_env!` and falls back to empty, so a credential-free CI
# build is correct (the watch takes creds at runtime via the Settings app).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create/attach GitHub Release assets on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirror rust-toolchain.toml: stable + rust-src + the riscv32imac bare-metal
      # target (its precompiled core/alloc are what the build uses; build-std in
      # the cargo config is tolerated/ignored on stable).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Recreate the gitignored build config (no runner, no creds — CI only
      # builds). Note: the repo's config carries `[unstable] build-std`, but on
      # the stable toolchain that's a no-op — the build uses the precompiled
      # riscv32imac target libs (verified: `cargo build --release` is green with
      # just target + rustflags). Omitting build-std here avoids any
      # unstable-feature error from a fresh CI cargo and produces the same binary.
      - name: Write .cargo/config.toml
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [build]
          target = "riscv32imac-unknown-none-elf"
          rustflags = ["-C", "force-frame-pointers"]
          EOF

      - name: Build firmware (release)
        run: cargo build --release --bin esp32c6-watch

      - name: Stage ELF
        run: cp target/riscv32imac-unknown-none-elf/release/esp32c6-watch esp32c6-watch.elf

      # Flashable image is best-effort: espflash pulls libudev; if the install or
      # save-image trips in CI, the ELF is still published and the job succeeds.
      - name: Build flashable .bin (best-effort)
        id: bin
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
          cargo install espflash --version 4.5.0 --locked
          espflash save-image --chip esp32c6 esp32c6-watch.elf esp32c6-watch.bin

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-watch-firmware
          path: |
            esp32c6-watch.elf
            esp32c6-watch.bin
          if-no-files-found: warn

      - name: Attach to the tag's Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32c6-watch.elf
            esp32c6-watch.bin
          fail_on_unmatched_files: false
