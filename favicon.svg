<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="esp32c6-watch">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset="1" stop-color="#35e0b0"/>
    </linearGradient>
  </defs>
  <!-- AMOLED rounded-rect body -->
  <rect x="14" y="6" width="36" height="52" rx="13" fill="#000"/>
  <rect x="14" y="6" width="36" height="52" rx="13" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- mesh links -->
  <g stroke="#35e0b0" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <line x1="32" y1="32" x2="22" y2="19"/>
    <line x1="32" y1="32" x2="43" y2="21"/>
    <line x1="32" y1="32" x2="24" y2="45"/>
    <line x1="32" y1="32" x2="42" y2="44"/>
  </g>
  <!-- mesh nodes -->
  <g fill="#3a7bd5">
    <circle cx="22" cy="19" r="2.6"/>
    <circle cx="43" cy="21" r="2.6"/>
    <circle cx="24" cy="45" r="2.6"/>
    <circle cx="42" cy="44" r="2.6"/>
  </g>
  <!-- central hub / clock center -->
  <circle cx="32" cy="32" r="5.4" fill="#35e0b0"/>
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#35e0b0" stroke-width="1.4" opacity="0.6"/>
</svg>
